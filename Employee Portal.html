<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dice · Employee Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#6C5DD3; --primary-600:#5B4CC4; --primary-50:#F1EFFC; --primary-100:#E4E0FA; --nav-active:#E6E3F1;
    --text:#1D1D22; --muted:#6E6E7A; --faint:#9A9AA6;
    --border:#E7E7EE; --row-alt:#F7F7FA; --bg:#FFFFFF; --page:#FBFBFD;
    --danger:#C8322F; --danger-bg:#F8DCD8; --success:#2F7D4F; --success-bg:#E3F1E7;
    --warn:#D9822B; --warn-bg:#FFF6EC; --hold:#5B6B8C; --hold-bg:#EEF1F7;
    --dark:#141416; --radius:6px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;top:0;left:0;right:0;height:4px;background:var(--primary);z-index:200}
  button{font-family:inherit;cursor:pointer;color:inherit}
  input,select,textarea{font-family:inherit;font-size:13px;color:var(--text)}
  a{color:inherit}
  svg.i{flex:none}

  /* ---------- Layout ---------- */
  .app{display:flex;min-height:100vh}
  .sidebar{width:216px;flex:none;border-right:1px solid var(--border);background:#fff;position:sticky;top:0;height:100vh;overflow-y:auto;padding:30px 6px 80px;transition:width .2s}
  .sidebar::-webkit-scrollbar{width:4px}.sidebar::-webkit-scrollbar-thumb{background:#ddd;border-radius:4px}
  .logo{display:flex;align-items:center;gap:6px;padding:0 18px;font-size:30px;font-weight:500;letter-spacing:-.5px}
  .who{padding:14px 18px 22px}
  .who-name{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
  .who-name .cur{width:20px;height:20px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;font-size:10px;font-weight:600}
  .who-mail{font-size:11px;color:#33333B;margin-top:4px;word-break:break-all}
  .who-role{font-size:10.5px;color:var(--muted);margin-top:2px}
  .nav-item{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:4px;color:#2A2A30;font-size:14px;cursor:pointer;user-select:none;margin-bottom:2px;border:none;background:none;width:100%;text-align:left}
  .nav-item:hover{background:var(--row-alt)}
  .nav-item .chev{margin-left:auto;color:#55555F}
  .nav-item.active{background:var(--nav-active);font-weight:500}
  .nav-group.open{background:var(--nav-active);border-radius:4px;padding-bottom:8px;margin-bottom:2px}
  .nav-group.open>.nav-item{font-weight:600}
  .nav-group.open>.nav-item:hover{background:transparent}
  .nav-sub{padding:0 14px}
  .nav-sub button{display:flex;align-items:center;gap:8px;width:100%;border:none;background:none;text-align:left;padding:9px 14px;font-size:12px;border-radius:3px;color:#33333B}
  .nav-sub button.active{background:#fff}
  .badge{min-width:22px;height:18px;border-radius:9px;background:var(--primary);color:#fff;font-size:10.5px;font-weight:600;display:inline-grid;place-items:center;padding:0 6px}
  .collapse-btn{position:fixed;left:196px;bottom:42px;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.08);z-index:30;transition:left .2s}
  body.collapsed .sidebar{width:68px}
  body.collapsed .sidebar .lbl,body.collapsed .who,body.collapsed .nav-item .chev,body.collapsed .nav-sub,body.collapsed .logo .word{display:none}
  body.collapsed .nav-group.open{background:none}
  body.collapsed .collapse-btn{left:48px}
  body.collapsed .collapse-btn svg{transform:rotate(180deg)}
  .main{flex:1;min-width:0;padding:24px 44px 60px}

  /* ---------- Top bar ---------- */
  .top{display:flex;align-items:center;gap:16px;min-height:56px}
  .top h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.3px}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:20px;position:relative}
  .guides{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:20px;border:none;background:#F1F1F4;font-size:13px;font-weight:500}
  .spark{width:38px;height:38px;border-radius:50%;border:none;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 6px rgba(240,120,120,.08),0 2px 10px rgba(229,72,77,.18)}
  .icon-btn{border:none;background:none;padding:4px;display:grid;place-items:center;position:relative}
  .icon-btn .dot{position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:#E5484D;border:2px solid #fff}
  .switch{height:40px;padding:0 20px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--primary);font-size:13.5px;font-weight:500}
  .switch:hover{border-color:var(--primary)}

  /* ---------- Home ---------- */
  .h2{font-size:22px;font-weight:600;margin:30px 0 18px;display:flex;align-items:center;gap:12px}
  .h2 .grow{flex:1}
  .quick{display:flex;gap:26px;flex-wrap:wrap}
  .quick button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:12px;font-size:12.5px;padding:0}
  .quick .circ{width:50px;height:50px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;background:#fff;transition:border-color .15s}
  .quick button:hover .circ{border-color:var(--primary);color:var(--primary)}
  .travel .circ{width:52px;height:52px;border:none;font-size:22px;position:relative}
  .travel .new{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:#EF6C2E;color:#fff;font-size:9px;font-weight:600;padding:2px 6px;border-radius:3px}
  .apps{display:flex;gap:14px;flex-wrap:wrap}
  .app-tile{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:4px;padding:6px 12px 6px 6px;background:#fff;font-size:12px;font-weight:600}
  .app-tile .ic{width:44px;height:44px;border-radius:8px;background:#111;display:grid;place-items:center}
  .app-tile:hover{border-color:var(--primary)}
  .ghost-sm{border:1px solid var(--border);background:#fff;border-radius:16px;padding:5px 14px;font-size:12px}
  .ghost-sm:hover{border-color:var(--primary);color:var(--primary)}
  .round-sm{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:#fff;display:grid;place-items:center}
  .mail-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
  .mail-card{border-radius:4px;box-shadow:0 1px 6px rgba(0,0,0,.09);padding:18px 20px;font-size:12px;background:#fff}
  .mail-card .k{font-size:13px;margin:12px 0 4px}
  .mail-card .v{font-size:11px;word-break:break-all}
  .mail-card .att{margin-top:12px;font-size:11px}
  .pa-row{display:flex;gap:18px;overflow-x:auto;scroll-behavior:smooth;padding:4px 2px 12px;scrollbar-width:none}
  .pa-row::-webkit-scrollbar{display:none}
  .pa-card{flex:0 0 280px;border:1px solid var(--border);border-radius:6px;padding:16px;background:#fff;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;font-size:12px}
  .pa-card:hover{border-color:var(--primary);box-shadow:0 2px 12px rgba(108,93,211,.12)}
  .pa-card .t{font-weight:600;font-size:13px;line-height:1.35}
  .pa-card .m{color:var(--muted);font-size:11.5px}
  .pa-card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .empty{border:1px dashed var(--border);border-radius:6px;padding:36px;text-align:center;color:var(--muted);font-size:13px}

  /* ---------- Approvals list ---------- */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:18px -44px 0;padding:0 44px;overflow-x:auto;scrollbar-width:none}
  .tabs button{border:none;background:none;padding:12px 14px 14px;font-size:15px;position:relative;white-space:nowrap}
  .tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:4px;border-radius:3px 3px 0 0;background:var(--primary)}
  .toolbar{display:flex;align-items:center;border-bottom:1px solid var(--border);margin:0 -44px;padding:0 44px;min-height:58px;flex-wrap:wrap;position:relative}
  .search{display:flex;align-items:center;gap:10px;padding:0 18px;width:240px;border-right:1px solid var(--border);height:30px}
  .search input{border:none;outline:none;font-size:15px;width:100%;background:none}
  .search input::placeholder{color:var(--faint)}
  .tool{display:flex;align-items:center;gap:8px;padding:0 18px;height:30px;border:none;background:none;font-size:15px;font-weight:500;position:relative}
  .tool.sep{border-right:1px solid var(--border);padding-right:32px}
  .tool:hover{color:var(--primary)}
  .tool .cnt{background:var(--primary);color:#fff;border-radius:8px;font-size:10px;padding:1px 6px}
  .bulk{display:flex;align-items:center;gap:12px;padding:10px 16px;margin-top:14px;background:var(--primary-50);border:1px solid var(--primary-100);border-radius:6px;font-size:13px}
  .bulk .grow{flex:1}
  .table-wrap{overflow-x:auto;margin-top:16px}
  table.grid{width:100%;border-collapse:collapse;min-width:1020px}
  table.grid th{text-align:left;font-size:15px;font-weight:600;padding:16px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
  table.grid td{padding:18px 12px;vertical-align:middle;font-size:15px}
  table.grid th:first-child,table.grid td:first-child{width:64px;text-align:center;border-right:1px solid var(--border)}
  table.grid tbody tr:nth-child(even){background:var(--row-alt)}
  table.grid tbody tr{cursor:pointer}
  table.grid tbody tr:hover{background:#F1EFFA}
  .chk{width:17px;height:17px;accent-color:var(--primary);cursor:pointer}
  .det-link{color:#55555F;text-decoration:underline;text-underline-offset:2px;font-size:15px;font-weight:500;line-height:1.55}
  .det-sub{font-size:12px;color:#55555F;line-height:1.65}
  .asker{display:flex;align-items:center;gap:9px;white-space:nowrap}
  .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600;flex:none}
  .av.lg{width:50px;height:50px;font-size:22px;font-weight:500}
  .status{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.2px;padding:6px 12px;border-radius:14px;border:1px solid;white-space:nowrap;text-transform:uppercase}
  .s-pending{color:var(--warn);border-color:#F2C394;background:var(--warn-bg)}
  .s-hold{color:var(--hold);border-color:#C9D1E0;background:var(--hold-bg)}
  .s-approved{color:var(--success);border-color:#A9D6B9;background:var(--success-bg)}
  .s-declined{color:var(--danger);border-color:#EDB2AD;background:#FDF0EE}
  .type-cell{color:#55555F;max-width:160px;line-height:1.4}
  .nowrap{white-space:nowrap}
  .cards-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:18px}
  .tbl-empty{padding:56px 20px;text-align:center;color:var(--muted)}
  .tbl-empty .big{font-size:16px;color:var(--text);font-weight:500;margin-bottom:6px}

  /* ---------- Popovers ---------- */
  .pop{position:absolute;top:100%;z-index:60;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:6px;min-width:220px;margin-top:4px}
  .pop button.opt{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;padding:9px 10px;font-size:13px;border-radius:4px;text-align:left}
  .pop button.opt:hover{background:var(--row-alt)}
  .pop button.opt.on{color:var(--primary);font-weight:600}
  .pop .ph{font-size:11px;color:var(--faint);padding:8px 10px 4px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .pop label{display:flex;align-items:center;gap:10px;padding:7px 10px;font-size:13px;cursor:pointer;border-radius:4px}
  .pop label:hover{background:var(--row-alt)}
  .pop .pf{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--border);margin-top:6px;padding:8px 4px 2px}
  .persona{display:flex;align-items:center;gap:10px}
  .persona small{display:block;color:var(--muted);font-size:11px;font-weight:400}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 20px;border-radius:5px;font-size:14px;font-weight:500;border:1px solid transparent;white-space:nowrap}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-600)}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .btn-ghost{background:#fff;border-color:var(--border)}
  .btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
  .btn-sm{height:30px;padding:0 12px;font-size:12.5px}
  .btn-danger{background:var(--danger);color:#fff}

  /* ---------- Drawer ---------- */
  .scrim{position:fixed;inset:0;background:rgba(20,20,26,.45);z-index:90;animation:fade .15s}
  .drawer{position:fixed;top:4px;right:0;bottom:0;left:70px;background:#fff;z-index:91;display:grid;grid-template-columns:minmax(0,1fr) clamp(380px,40%,560px);animation:slide .2s ease-out}
  @keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
  @keyframes fade{from{opacity:0}}
  .d-left{overflow-y:auto;padding:26px 36px 50px;border-right:8px solid #E9E9EE}
  .d-left h2{margin:0 0 22px;font-size:24px;font-weight:600}
  .d-sec{font-size:12.5px;font-weight:700;text-transform:uppercase;margin:0 0 10px;letter-spacing:.1px}
  .kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 30px}
  .kv .k{color:var(--muted);font-size:14px;margin-bottom:6px}
  .kv .v{font-size:12.5px;line-height:1.5;word-break:break-word}
  .kv.full{grid-column:1/-1}
  .hr{border:none;border-top:1px solid var(--border);margin:30px 0}
  .items{width:100%;border-collapse:collapse;border:1px solid var(--border);font-size:12.5px}
  .items th{background:#F1F1F1;font-size:12px;font-weight:700;text-transform:uppercase;padding:18px 12px;border:1px solid var(--border);text-align:center}
  .items td{border:1px solid var(--border);padding:16px 14px;vertical-align:middle;text-align:center}
  .items td.l{text-align:left;vertical-align:top}
  .items .nm{font-size:16px;font-weight:500;margin-bottom:4px}
  .items .meta{line-height:1.6}
  .items .meta span{color:var(--muted)}
  .total{display:flex;justify-content:space-between;align-items:center;background:var(--primary-100);border-radius:4px;padding:16px 18px;font-weight:600;font-size:13px;margin-top:16px}
  .files{display:flex;gap:18px;flex-wrap:wrap}
  .file{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;max-width:110px;text-align:center}
  .file .pdf{width:58px;height:58px;border-radius:12px;background:#D93A2F;color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px}
  .file .xls{background:#2F8A57}
  .file:hover .pdf{filter:brightness(1.08)}
  .file .fn{color:#33333B;line-height:1.3}
  .note{border:1px solid #F2D3A7;background:#FFF8EE;color:#7A4A10;border-radius:6px;padding:10px 14px;font-size:12.5px;line-height:1.5;margin-bottom:22px;display:flex;gap:10px}
  .note.info{border-color:var(--primary-100);background:var(--primary-50);color:#3D3290}
  .note.ok{border-color:#A9D6B9;background:var(--success-bg);color:#215A39}
  .note.bad{border-color:#EDB2AD;background:#FDF0EE;color:#8A2420}

  .d-right{display:flex;flex-direction:column;min-height:0;background:#fff}
  .d-right-head{padding:22px 36px 0}
  .x-btn{border:none;background:none;padding:0;display:grid;place-items:center;margin-bottom:22px}
  .d-right-head h3{margin:0;font-size:28px;font-weight:600}
  .d-right-head .sub{font-size:13px;margin-top:4px}
  .d-tabs{display:flex;gap:6px;margin:26px -36px 0;padding:0 36px;border-bottom:1px solid var(--border)}
  .d-tabs button{border:none;background:none;padding:10px 14px 14px;font-size:16px;position:relative}
  .d-tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:4px;border-radius:3px 3px 0 0;background:var(--primary)}
  .d-tabs .pip{display:inline-block;width:7px;height:7px;border-radius:50%;background:#E5484D;margin-left:6px;vertical-align:middle}
  .d-body{flex:1;overflow-y:auto;padding:26px 36px 30px}
  .d-foot{border-top:1px solid var(--border);padding:16px 36px 20px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .d-foot .wide{grid-column:1/-1}
  .act{height:50px;border-radius:3px;border:none;font-size:18px;display:flex;align-items:center;justify-content:center;gap:6px}
  .act-dec{background:var(--danger-bg);color:var(--danger)}
  .act-dec:hover{background:#F3CBC5}
  .act-app{background:var(--success-bg);color:var(--success)}
  .act-app:hover{background:#D3EBDB}
  .act-hold{background:var(--primary);color:#fff;font-size:17px}
  .act-hold:hover{background:var(--primary-600)}
  .act-waive{background:#fff;color:var(--primary);border:1.5px solid var(--primary);font-size:17px}
  .act-waive:hover{background:#F3F1FD}
  .done-banner{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:13px;padding:12px 14px;border-radius:5px}
  .rq-label{font-size:17px;margin-bottom:16px}
  .rq-card{display:flex;gap:16px;border:1px solid var(--border);border-radius:6px;padding:22px 18px;align-items:flex-start;font-size:13px;line-height:1.55}
  .rq-card .nm{font-weight:600}
  .rq-card .code{margin-left:auto;font-weight:700;white-space:nowrap}
  .r-field{padding:0}
  .r-field .k{color:var(--muted);font-size:15px;margin-bottom:6px}
  .r-field .v{font-size:17px}
  .r-section{margin-top:30px;padding-top:30px;border-top:1px solid var(--border)}
  .r-section .t{font-size:13.5px;font-weight:700;text-transform:uppercase}
  .r-section .s{font-size:13px;color:var(--muted);margin:2px 0 14px}
  .r-list .k{color:var(--muted);font-size:15px;margin-top:16px}
  .r-list .v{font-size:13.5px;margin-top:6px;line-height:1.5}
  .chain{display:flex;flex-direction:column;gap:0;margin-top:6px}
  .chain .lv{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:13px}
  .chain .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:1.5px solid var(--border);color:var(--muted);flex:none}
  .chain .lv.done .num{background:var(--primary);border-color:var(--primary);color:#fff}
  .chain .lv.cur .num{border-color:#3FA36B;color:#3FA36B}
  .chain .lv.dec .num{background:var(--danger);border-color:var(--danger);color:#fff}
  .chain .lv small{display:block;color:var(--muted);font-size:11.5px}
  .chain .lv .tag{margin-left:auto}

  /* Timeline */
  .tl-title{font-size:13.5px;font-weight:700;margin-bottom:30px}
  .tl{position:relative;padding-left:46px}
  .tl::before{content:"";position:absolute;left:2px;top:0;bottom:0;width:4px;border-radius:2px;background:#E3E3EC}
  .tl-item{position:relative;border:1px solid var(--border);border-radius:6px;padding:16px 16px 26px;margin-bottom:34px;font-size:13.5px;line-height:1.85}
  .tl-item .lbl{font-size:13.5px}
  .tl-item .nm{font-weight:600}
  .tl-item .ln{margin-top:4px}
  .tl-item .ln div{line-height:1.9}
  .tl-item .tat{position:absolute;top:30px;right:12px;font-size:13px;font-weight:600;color:#2F8A6B;background:#E4F6EF;border:1px solid #BFE6D6;border-radius:14px;padding:1px 8px}
  .tl-dot{position:absolute;left:-55px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff}
  .tl-dot.done{background:var(--primary);box-shadow:0 0 0 3px #fff}
  .tl-dot.current{background:#3F8C55;box-shadow:0 0 0 3px #fff}
  .tl-dot.upcoming{background:#fff;border:2px solid #C9C9D3}
  .tl-dot.hold{background:var(--hold)}
  .tl-dot.declined{background:var(--danger)}
  .tl-dot.clar{background:#E9A23B}
  .tl-item.upcoming{opacity:.6;border-style:dashed}
  .tl-item .cmt{margin-top:8px;background:var(--row-alt);border-radius:4px;padding:6px 10px;font-size:12.5px;line-height:1.5;font-style:italic}

  /* Clarification */
  .clar-wrap{display:flex;flex-direction:column;height:100%}
  .clar-list{flex:1;display:flex;flex-direction:column;gap:14px}

/* =====================================================================
   Inspection Requests — live from the Vendor Portal through localStorage (same origin, e.g. Live Server).
   The IR record is the source of truth: approvals, holds and clarifications made here are written back to it,
   so the Vendor and Buyer portals show the status as it changes. A merged IR (several MC items) is one approval.
   ===================================================================== */
const IR_STORE = 'bajel.ir.v2';
const readSharedIRs = () => { try { return JSON.parse(localStorage.getItem(IR_STORE) || 'null')?.irs || []; } catch (e) { return []; } };
const writeSharedIRs = irs => { try { localStorage.setItem(IR_STORE, JSON.stringify({ irs })); } catch (e) {} };
/* register the IR's vendor (and its contact person, who is the requester) so the existing lookups work */
function vendorRefs(v) {
  let vk = Object.keys(VENDORS).find(k => VENDORS[k].name.toUpperCase() === String(v.name).toUpperCase());
  if (!vk) { vk = 'x:' + v.name; VENDORS[vk] = { name: v.name, trade: v.name, pan: v.pan || '—', gstin: v.gstin || '—', code: v.code || '—', addr: v.addr || '—' }; }
  let pk = Object.keys(PEOPLE).find(k => PEOPLE[k].vendor && PEOPLE[k].name === v.contact);
  if (!pk) { pk = 'vc:' + v.name; PEOPLE[pk] = { name: v.contact || v.name, email: v.email || '—', dept: 'Vendor · ' + v.name, office: '—', code: v.code ? 'V-' + v.code : '—', role: 'Vendor', vendor: true }; }
  return [vk, pk];
}
function irReqs() {
  const groups = new Map();
  readSharedIRs().forEach(x => { const k = x.po + '|' + x.id; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(x); });
  return [...groups.values()].map(items => {
    items.sort((a, b) => (a.item || 1) - (b.item || 1));
    const r0 = items[0];
    const a = r0.appr || { chain: ['priya', 'rahul'], level: 0, state: 'pending', history: [], clar: [] };
    const [vk, pk] = vendorRefs(r0.vendor || { name: r0.by || 'Vendor', contact: r0.contact });
    if (r0.office && !OFFICES[r0.office]) OFFICES[r0.office] = r0.office;
    const who = by => by === 'vendor' ? pk : by;
    const history = [{ t: 'start', by: pk, at: new Date(r0.createdAt) }, ...(a.history || []).map(h => ({ ...h, by: who(h.by), at: new Date(h.at) }))];
    if (r0.status === 'Withdrawn') history.push({ t: 'withdrawn', by: pk, at: new Date(r0.withdrawnAt), note: r0.withdrawReason || '' });
    return { id: `ir:${r0.po}:${r0.id}`, shared: true, irId: r0.id, type: 'ir', ref: r0.id, title: `Inspection · ${items.map(x => x.mcId).join(', ')}`,
      asker: pk, vendor: vk, office: r0.office, poNo: r0.po, chain: a.chain, level: a.level,
      status: r0.status === 'Withdrawn' ? 'withdrawn' : a.state, withdrawReason: r0.withdrawReason, received: new Date(r0.createdAt),
      lines: items.map(x => ({ item: x.item || 1, mc: x.mcId, code: x.lineCode, desc: x.lineDesc || '', loc: x.mcLocation, mcQty: x.mcQty, qty: x.qty, unit: x.unit || '' })),
      inspDate: new Date(r0.inspDate + 'T00:00'), location: r0.location, contact: `${r0.contact} · ${r0.phone}`, remarks: r0.remarks,
      files: (r0.docs || []).map(pdf), history, clar: (a.clar || []).map(c => ({ ...c, by: who(c.by), at: new Date(c.at) })) };
  });
}
/* Inspection can be waived per IR item. Each waive entry in the history lists the items it waived
   (older entries without a list waived every item); item number → the approval entry that waived it */
const lineNo = (l, i) => l.item || i + 1;
function waivedMap(r) {
  const m = new Map();
  r.history.filter(h => h.waive).forEach(h => (h.waivedItems || r.lines.map(lineNo)).forEach(n => { if (!m.has(n)) m.set(n, h); }));
  return m;
}
const waiveSummary = (h, r) => h.waivedItems ? `${h.waivedItems.length} of ${r.lines.length} item${r.lines.length > 1 ? 's' : ''}` : 'all items';
/* write an approver's action on a shared IR back to every item of it; false if the vendor withdrew it meanwhile */
function commitIR(r) {
  const out = by => by === r.asker ? 'vendor' : by;
  const all = readSharedIRs(), items = all.filter(x => x.po === r.poNo && x.id === r.irId);
  if (!items.length || items[0].status === 'Withdrawn') return false;
  const appr = { chain: r.chain, level: r.level, state: r.status,
    history: r.history.filter(h => !['start', 'withdrawn'].includes(h.t)).map(h => ({ t: h.t, by: out(h.by), at: new Date(h.at).toISOString(), note: h.note || '', ...(h.waive ? { waive: true, ...(h.waivedItems ? { waivedItems: h.waivedItems } : {}) } : {}) })),
    clar: r.clar.map(c => ({ by: out(c.by), at: new Date(c.at).toISOString(), text: c.text })) };
  const last = [...appr.history].reverse().find(h => h.t === 'approved' || h.t === 'declined');
  const wm = waivedMap(r);
  items.forEach(x => {
    x.appr = appr;
    // waived items skip the inspection report: full IR qty accepted, rejected fixed at 0
    const w = wm.get(x.item || 1);
    if (w) x.waiveInspection = { by: out(w.by), at: new Date(w.at).toISOString(), note: w.note || '' };
    else delete x.waiveInspection;
    if (r.status === 'approved' && x.status === 'Pending') {
      Object.assign(x, { status: 'Report Pending', approvedAt: last.at, approvedBy: `${P(last.by).name} (${P(last.by).role})` });
      if (w) Object.assign(x, { status: 'Ready to Dispatch', accepted: x.qty, rejected: 0, inspectedAt: last.at.slice(0, 10), inspectionWaived: true,
        inspector: `Waived by ${P(w.by).name}`, inspRemarks: w.note });
    }
    if (r.status === 'declined') Object.assign(x, { status: 'Declined', declinedAt: last.at, declinedBy: P(last.by).name, declineReason: last.note });
  });
  writeSharedIRs(all);
  return true;
}

/* =====================================================================

   ===================================================================== */
const kv = (k, v, full) => `<div class="kv ${full ? 'full' : ''}"><div class="k">${esc(k)}</div><div class="v">${v}</div></div>`;
const filesBlock = files => `<hr class="hr"><div class="d-sec">Files</div>${files.length ? `<div class="files">${files.map((f, i) => `<button class="file" data-act="file" data-name="${esc(f.name)}"><span class="pdf ${f.kind === 'xls' ? 'xls' : ''}">${f.kind === 'xls' ? 'XLS' : 'PDF'}</span><span class="fn">#${i + 1} ${esc(f.name)}</span></button>`).join('')}</div>` : '<div style="color:var(--muted);font-size:13px">No files attached.</div>'}`;
function vendorBlock(r) {
  const v = VENDORS[r.vendor];
  return `<div class="d-sec">Vendor Details</div><div class="kv-grid">
    ${kv('Name', esc(v.name))}${kv('Trade Name', esc(v.trade))}${kv('PAN', esc(v.pan))}${kv('GSTIN', esc(v.gstin))}${kv('Vendor Code', esc(v.code), true)}${kv('Vendor Address', esc(v.addr), true)}
  </div>`;
}

function leftPane(r) {
  if (r.type === 'po') {
    const tot = r.items.reduce((a, i) => a + i.qty * i.rate, 0);
    const failed = r.items.some(i => i.budget === 'failed');
    return `<h2>${esc(r.ref)} / ${esc(r.title)}</h2>
      ${failed ? `<div class="note">${icon('info', 18)}<span>Auto-budgeting failed for one or more line items. Approving will consume budget beyond the allocated head.</span></div>` : ''}
      ${vendorBlock(r)}<hr class="hr">
      <div class="d-sec" style="margin-bottom:16px">PO Items (${r.items.length})</div>
      <table class="items"><thead><tr><th>Details</th><th>Quantity</th><th>Amount</th><th style="text-align:right">PR ID</th></tr></thead><tbody>
        ${r.items.map(i => `<tr><td class="l"><div class="nm">${esc(i.name)}</div><div class="meta">Hsn Code: ${esc(i.hsn)}<br>Item Code: ${esc(i.code)}<br>Description: ${esc(i.desc)}<br>Delivery Address : ${esc(OFFICES[r.office])}<br>Auto Budgeting: yes<br>Budget Status: <b style="color:${i.budget === 'failed' ? 'var(--danger)' : 'var(--success)'}">${i.budget}</b><br><span>lastPurchasePrice:</span> ${num(i.rate)}<br><span>qcEnabled:</span> ${r.vendor === 'palriwal' ? 'yes' : 'no'}</div></td>
          <td>${num(i.qty)} ${esc(i.unit)} @ INR ${num(i.rate)} / ${esc(i.unit)}</td><td>INR ${num(i.qty * i.rate)}</td><td style="text-align:right">${esc(i.pr)}</td></tr>`).join('')}
      </tbody></table>
      <div class="total"><span>Total Purchase Order Value <span style="font-weight:400;color:var(--muted)">(excl. 18% GST)</span></span><span>INR ${num(tot)}</span></div>
      ${filesBlock(r.files)}`;
  }
  if (r.type === 'ir') {
    return `<h2>Inspection Request · ${esc(r.ref)}</h2>
      ${r.status === 'withdrawn' ? `<div class="note">${icon('info', 18)}<span>Withdrawn by the vendor${r.withdrawReason ? ` — “${esc(r.withdrawReason)}”` : ''}. No action needed.</span></div>` : ''}
      ${(wm => wm.size ? `<div class="note">${icon('info', 18)}<span>Inspection waived for <b>${wm.size} of ${r.lines.length}</b> item${r.lines.length > 1 ? 's' : ''}. ${r.status === 'approved' ? 'Waived items were' : 'After final approval, waived items are'} accepted in full with rejected quantity 0 and no inspection report${wm.size < r.lines.length ? '; the remaining items go to the buyer for inspection' : ''}.</span></div>` : '')(waivedMap(r))}
      <div class="note info">${icon('info', 18)}<span>Raised by the vendor on the Vendor Portal. Once every approver approves, Hindalco's buyer can record the inspection result and raise the Dispatch Request.</span></div>
      ${vendorBlock(r)}<hr class="hr">
      <div class="d-sec">Inspection Details</div>
      <div class="kv-grid">${kv('PO Number', esc(r.poNo))}${kv('Proposed Inspection Date', fDate(r.inspDate))}${kv('Inspection Location', esc(r.location), true)}${kv('Vendor Contact', esc(r.contact), true)}${r.remarks ? kv('Vendor Remarks', esc(r.remarks), true) : ''}</div>
      <hr class="hr"><div class="d-sec" style="margin-bottom:16px">Clearances offered for inspection (${r.lines.length})</div>
      <table class="items"><thead><tr><th>MC ID</th><th>Item</th><th>Shipping Location</th><th>Cleared Qty</th><th>Inspection Qty</th><th>Inspection</th></tr></thead><tbody>
        ${(wm => r.lines.map((l, i) => { const w = wm.get(lineNo(l, i)); return `<tr><td><b>${esc(l.mc)}</b></td><td class="l">${l.code ? `<b>${esc(l.code)}</b><br>` : ''}${esc(l.desc)}</td><td class="l">${esc(l.loc || '—')}</td><td>${l.mcQty != null ? `${num(l.mcQty)} ${esc(l.unit)}` : '—'}</td><td><b>${num(l.qty)} ${esc(l.unit)}</b></td>
          <td>${w ? `<span class="wv-tag y">Waived</span><div style="font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5">by ${esc(P(w.by).name)}<br>Accepted ${num(l.qty)} · Rejected 0</div>` : '<span class="wv-tag n">Required</span>'}</td></tr>`; }).join(''))(waivedMap(r))}
      </tbody></table>
      ${filesBlock(r.files)}`;
  }
  // bg
  return `<h2>${esc(r.ref)} / ${esc(r.title)}</h2>
    ${vendorBlock(r)}<hr class="hr">
    <div class="d-sec">Guarantee Details</div>
    <div class="kv-grid">${kv('Guarantee Type', esc(r.kind), true)}${kv('Issuing Bank', esc(r.bank))}${kv('Branch', esc(r.branch))}
      ${kv('Guarantee Amount', '<b>' + inr(r.amount) + '</b>')}${kv('Against PO', esc(r.poNo))}
      ${kv('Issue Date', fDate(r.issued))}${kv('Expiry Date', fDate(r.expiry))}
      ${kv('Claim Period Ends', fDate(r.claim))}${kv('Beneficiary', esc(r.beneficiary))}</div>
    ${filesBlock(r.files)}`;
}

function rightApproval(r) {
  const a = P(r.asker);
  const v = VENDORS[r.vendor];
  const amt = amountOf(r);
  const f = (k, val) => `<div class="k">${esc(k)}</div><div class="v">${val}</div>`;
  let key, fields;
  if (r.type === 'po') { key = ['PO Number', r.ref];
    fields = f('Category', esc(r.category)) + f('Order Id', esc(r.ref)) + f('Title', esc(r.title)) + f('Billing Address', esc(BILLING)) + f('Delivery Address', esc(OFFICES[r.office])) + f('Currency', 'INR') + f('Amount ( Incl. Tax )', num(amt)) + f('Raised By', esc(a.name)) + f('Vendor Name', esc(v.name)); }
  if (r.type === 'ir') { key = ['Inspection Request', r.ref];
    fields = f('PO Number', esc(r.poNo)) + f('Clearances', r.lines.map(l => esc(l.mc)).join(', ')) + f('Inspection Qty', r.lines.map(l => `${num(l.qty)} ${esc(l.unit)}`).join(', ')) + f('Inspection Date', fDate(r.inspDate)) + f('Location', esc(r.location))
      + ((wm => wm.size ? f('Inspection Waived', `${wm.size} of ${r.lines.length} item${r.lines.length > 1 ? 's' : ''} · ${r.lines.filter((l, i) => wm.has(lineNo(l, i))).map(l => esc(l.mc)).join(', ')}`) : '')(waivedMap(r)))
      + f('Raised By', `${esc(a.name)} (Vendor)`) + f('Vendor Name', esc(v.name)); }
  if (r.type === 'bg') { key = ['BG Number', r.ref.replace('BG/', '')];
    fields = f('Guarantee Type', esc(r.kind)) + f('Bank', esc(r.bank + ', ' + r.branch)) + f('Currency', 'INR') + f('Amount', num(r.amount)) + f('Against PO', esc(r.poNo)) + f('Raised By', esc(a.name)) + f('Vendor Name', esc(v.name)); }

  const chain = r.chain.map((k, i) => {
    const h = r.history.find(h => ['approved','declined'].includes(h.t) && h.by === k);
    const st = h ? (h.t === 'declined' ? 'dec' : 'done') : (i === r.level && (r.status === 'pending' || r.status === 'hold') ? 'cur' : '');
    const tag = h ? (h.t === 'declined' ? '<span class="status s-declined">Declined</span>' : '<span class="status s-approved">Approved</span>')
      : st === 'cur' ? (r.status === 'hold' ? '<span class="status s-hold">On Hold</span>' : '<span class="status s-pending">Pending</span>') : '';
    return `<div class="lv ${st}"><span class="num">${h?.t === 'approved' ? icon('check', 13, 3) : i + 1}</span><span>${esc(P(k).name)}${k === me ? ' (you)' : ''}<small>${esc(P(k).role)}</small></span><span class="tag">${tag}</span></div>`;
  }).join('');

  return `<div class="rq-label">Requested By</div>
    <div class="rq-card">${avatar(a, 'lg')}<div><div class="nm">${esc(a.name)}</div>Email : ${esc(a.email)}<br>Department: ${esc(a.dept)}<br>Office: ${esc(a.office)}</div><div class="code">CODE: ${esc(a.code)}</div></div>
    <div class="r-section r-field" style="border-top:none;margin-top:30px;padding-top:0"><div class="k">${esc(key[0])}</div><div class="v">${esc(key[1])}</div></div>
    <div class="r-section"><div class="t">Details</div><div class="s">Details of ${esc(TYPES[r.type].label.toLowerCase())}</div><div class="r-list">${fields}</div></div>
    <div class="r-section"><div class="t">Approval Flow</div><div class="s">${r.chain.length} level${r.chain.length > 1 ? 's' : ''}</div><div class="chain">${chain}</div></div>`;
}

function timelineItems(r) {
  const T = TYPES[r.type].slug.toUpperCase();
  const out = [];
  const ev = [...r.history].sort((a, b) => a.at - b.at);
  ev.forEach((h, i) => {
    const prev = i ? ev[i - 1].at : h.at;
    const tat = i ? dur(h.at - prev) : '< 1m';
    const p = P(h.by);
    const n = out.length;
    if (h.t === 'start') out.push({ st:'done', lbl:'App Started', nm:`Submitted by ${p.name}`, ln:['Type: start', `Sent on : ${fTime(h.at)}`], tat });
    if (h.t === 'approved') out.push({ st:'done', lbl:'Approver', nm:p.name, ln:[`Type: ${T}`, `Status: APPROVED${h.waive ? ` · INSPECTION WAIVED (${waiveSummary(h, r).toUpperCase()})` : ''}`, `Actioned on : ${fTime(h.at)}`], tat, note:h.note });
    if (h.t === 'declined') out.push({ st:'declined', lbl:'Approver', nm:p.name, ln:[`Type: ${T}`, 'Status: DECLINED', `Actioned on : ${fTime(h.at)}`], tat, note:h.note });
    if (h.t === 'hold') out.push({ st:'hold', lbl:'Put on Hold', nm:p.name, ln:[`Status: ON HOLD`, `On : ${fTime(h.at)}`], tat, note:h.note });
    if (h.t === 'unhold') out.push({ st:'done', lbl:'Hold Released', nm:p.name, ln:[`On : ${fTime(h.at)}`], tat, note:h.note });
    if (h.t === 'withdrawn') out.push({ st:'declined', lbl:'Withdrawn', nm:`Withdrawn by ${p.name} (Vendor)`, ln:[`On : ${fTime(h.at)}`], tat, note:h.note });
    if (out[n]) out[n].at = h.at;
  });
  r.clar.forEach(c => out.push({ st:'clar', lbl:'Clarification', nm:P(c.by).name, ln:[`On : ${fTime(c.at)}`], note:c.text, at:c.at }));
  const merged = out.sort((a, b) => a.at - b.at);
  if (r.status === 'pending' || r.status === 'hold') {
    const k = currentApprover(r), last = ev[ev.length - 1];
    merged.push({ st:'current', lbl:'Approver', nm:P(k).name, ln:[`Type: ${T}`, `Status: ${r.status === 'hold' ? 'ON HOLD' : STAGE[k] || 'PENDING'}`, `Sent on : ${fTime(last.at)}`], tat: dur(Date.now() - last.at) });
    r.chain.slice(r.level + 1).forEach(k2 => merged.push({ st:'upcoming', lbl:'Approver', nm:P(k2).name, ln:[`Type: ${T}`, 'Status: NOT STARTED'] }));
  }
  return merged;
}
function rightTimeline(r) {
  const dot = { done: icon('check', 13, 3), declined: icon('x', 13, 3), hold: icon('pause', 11, 2.5), clar: icon('msg', 11, 2.5), current: '', upcoming: '' };
  return `<div class="tl-title">TIMELINE</div><div class="tl">${timelineItems(r).map(t => `
    <div class="tl-item ${t.st === 'upcoming' ? 'upcoming' : ''}"><span class="tl-dot ${t.st}">${dot[t.st]}</span>
      <div class="lbl">${esc(t.lbl)}</div><div class="nm">${esc(t.nm)}</div>
      ${t.tat ? `<span class="tat">TAT: ${t.tat}</span>` : ''}
      <div class="ln">${t.ln.map(l => `<div>${esc(l)}</div>`).join('')}</div>
      ${t.note ? `<div class="cmt">“${esc(t.note)}”</div>` : ''}
    </div>`).join('')}</div>`;
}
function rightClar(r) {
  const amRequester = r.asker === me;
  const target = amRequester ? P(currentApprover(r) || r.chain[r.chain.length - 1]) : P(r.asker);
  const closed = r.status === 'approved' || r.status === 'declined' || r.status === 'withdrawn';
  return `<div class="clar-wrap">
    <div class="clar-list">${r.clar.length ? r.clar.map(c => `<div class="msg ${c.by === me ? 'me' : ''}"><div class="h"><b>${esc(P(c.by).name)}</b> · ${fTime(c.at)}</div>${esc(c.text)}</div>`).join('') :
      `<div style="color:var(--muted);font-size:13px;line-height:1.6">No clarifications yet.<br>${amRequester ? 'Approvers can ask you questions about this request here.' : `Ask ${esc(target.name)} for more information before you approve. The request stays in your queue while you wait.`}</div>`}
      ${ui.typing === r.id ? `<div class="typing">${esc(P(r.asker).name)} is typing…</div>` : ''}
    </div>
    ${closed ? '' : `<div class="composer"><div class="to">To: ${esc(target.name)} (${amRequester ? 'approver' : 'requester'})</div>
      <textarea id="clarText" placeholder="${amRequester ? 'Reply to the approver…' : 'e.g. Please share the revised quotation with freight break-up'}"></textarea>
      <div class="row">${amRequester ? '' : `<div class="chips" style="margin-right:auto">${['Share revised quotation','Confirm delivery schedule','Attach test certificate'].map(c => `<button data-chip="${esc(c)}">${esc(c)}</button>`).join('')}</div>`}
      <button class="btn btn-primary btn-sm" data-act="send-clar">${icon('send', 14, 2)} Send</button></div></div>`}
  </div>`;
}

function renderDrawer() {
  const r = findReq(ui.open);
  if (!r) return '';
  const canAct = isMine(r);
  const myAct = [...r.history].reverse().find(h => ['approved','declined'].includes(h.t) && h.by === me);
  const unread = r.clar.length && r.clar[r.clar.length - 1].by !== me;
  let foot;
  if (r.status === 'withdrawn') foot = `<div class="done-banner note" style="margin:0">${icon('info', 18)}<span>Withdrawn by the vendor — no action needed.</span></div>`;
  else if (canAct) foot = `
    <button class="act act-dec" data-act="decline">${icon('x', 18, 2)} Decline</button>
    <button class="act act-app" data-act="approve">${icon('check', 18, 2)} Approve</button>
    ${r.type === 'ir' && waivedMap(r).size < r.lines.length ? `<button class="act act-waive" data-act="waive" title="Approve without a physical inspection">Waive Inspection</button>` : ''}
    ${r.status === 'hold' ? `<button class="act act-hold ${r.type === 'ir' ? '' : 'wide'}" data-act="unhold">${icon('play', 16, 2)} Release Hold</button>` : `<button class="act act-hold ${r.type === 'ir' ? '' : 'wide'}" data-act="hold">Hold Approval</button>`}`;
  else if (myAct) foot = `<div class="done-banner note ${myAct.t === 'declined' ? 'bad' : 'ok'}" style="margin:0">${icon(myAct.t === 'declined' ? 'x' : 'check', 18, 2)}<span>You ${myAct.t} this on ${fTime(myAct.at)}${r.status === 'pending' ? ` · now pending with ${esc(P(currentApprover(r)).name)}` : ''}</span></div>`;
  else if (r.asker === me) foot = `<div class="done-banner note info" style="margin:0">${icon('info', 18)}<span>${r.status === 'approved' ? 'Fully approved.' : r.status === 'declined' ? 'Declined.' : `Waiting on ${esc(P(currentApprover(r)).name)} (${r.status === 'hold' ? 'on hold' : 'level ' + (r.level + 1) + ' of ' + r.chain.length})`}</span></div>`;
  else foot = '';
  return `<div class="scrim" data-act="close"></div>
  <div class="drawer" role="dialog" aria-label="${esc(r.ref)}">
    <div class="d-left">${leftPane(r)}</div>
    <div class="d-right">
      <div class="d-right-head">
        <button class="x-btn" data-act="close" aria-label="Close">${icon('x', 30, 2.4)}</button>
        <h3>${r.asker === me ? 'Requester' : 'Approver'}</h3><div class="sub">${esc(P(me).email)}</div>
        <div class="d-tabs">${[['approval','Approval'],['timeline','Timeline'],['clar','Clarification']].map(([k, l]) => `<button class="${ui.dtab === k ? 'on' : ''}" data-dtab="${k}">${l}${k === 'clar' && unread && ui.dtab !== 'clar' ? '<span class="pip"></span>' : ''}</button>`).join('')}</div>
      </div>
      <div class="d-body">${ui.dtab === 'approval' ? rightApproval(r) : ui.dtab === 'timeline' ? rightTimeline(r) : rightClar(r)}</div>
      ${foot ? `<div class="d-foot">${foot}</div>` : ''}
    </div>
  </div>`;
}

    waive: { h:'Waive Inspection', wide:true, p: `Choose the items that don't need a physical inspection. ${rs[0]?.level + 1 < rs[0]?.chain.length ? `The request still goes to ${esc(P(rs[0].chain[rs[0].level + 1]).name)} for approval; after` : 'After'} the final approval each waived item is accepted in full with rejected quantity 0 and no inspection report. The other items go to the buyer for inspection.`,
      body: `${waiveTable(rs[0])}<div class="field" id="fNote" style="margin-top:16px"><label>Reason for waiver <span class="req">*</span></label><textarea id="mNote" placeholder="e.g. Catalogue item, test certificate verified"></textarea><span class="err">Please add a reason.</span></div>
        <div class="chips">${['Catalogue item — test certificate verified','Repeat supply from approved vendor','Third-party inspection report accepted'].map(c => `<button data-mchip="${c}">${c}</button>`).join('')}</div>`, btn:'Approve & Waive Inspection', cls:'btn-primary' },
    unhold: { h:'Release Hold', p:'The request goes back to your Pending queue.', body:`<div class="field"><label>Comment (optional)</label><textarea id="mNote" placeholder="e.g. Corrected documents received"></textarea></div>`, btn:'Release Hold', cls:'btn-primary' },
  }[modal.kind];
  return `<div class="overlay" data-act="m-close-bg"><div class="modal ${M.wide ? 'wide' : ''}" role="dialog" aria-modal="true">
    <div class="modal-head"><h3>${M.h}</h3><p>${M.p}</p><button class="x" data-act="m-close" aria-label="Close">${icon('x', 20, 2.4)}</button></div>
    <div class="modal-body">${M.body}</div>
    <div class="modal-foot"><button class="btn ${M.cls}" data-act="m-confirm">${M.btn}</button></div>
  </div></div>`;
}

/* one row per IR item: tick to waive → Accepted = inspection qty, Rejected locked at 0. Items an earlier approver waived stay locked */
function waiveTable(r) {
  if (!r) return '';
  const wm = waivedMap(r), open = r.lines.filter((l, i) => !wm.has(lineNo(l, i))).length;
  return `<div class="field" id="fWv" style="margin-bottom:0"><div style="overflow-x:auto"><table class="wv-table"><thead><tr>
      <th style="width:34px"><input type="checkbox" class="chk" data-wv-all ${open ? '' : 'disabled checked'} aria-label="Waive all items"></th>
      <th>MC ID / Item</th><th>Inspection Qty</th><th>Accepted Qty</th><th>Rejected Qty</th><th>Inspection</th></tr></thead>
    <tbody>${r.lines.map((l, i) => { const n = lineNo(l, i), w = wm.get(n); return `<tr class="${w ? 'locked' : ''}" data-wv-row="${n}">
      <td><input type="checkbox" class="chk" data-wv="${n}" ${w ? 'checked disabled' : ''} aria-label="Waive inspection for ${esc(l.mc)}"></td>
      <td><b>${esc(l.mc)}</b><div style="color:var(--muted);font-size:11.5px;margin-top:2px;max-width:260px">${l.code ? esc(l.code) + ' · ' : ''}${esc(l.desc)}</div></td>
      <td><b>${num(l.qty)}</b> ${esc(l.unit)}</td>
      <td><span class="wv-on"><b style="color:var(--success)">${num(l.qty)}</b> ${esc(l.unit)}</span><span class="wv-off" style="color:var(--muted)">From inspection</span></td>
      <td><span class="wv-on"><input class="rej" value="0" disabled title="Rejected quantity is fixed at 0 for a waived item"></span><span class="wv-off" style="color:var(--muted)">From inspection</span></td>
      <td>${w ? `<span class="wv-tag y">Waived</span><div style="font-size:11px;margin-top:4px">by ${esc(P(w.by).name)}</div>` : '<span class="wv-on"><span class="wv-tag y">Waived</span></span><span class="wv-off"><span class="wv-tag n">Required</span></span>'}</td></tr>`; }).join('')}</tbody></table></div>
    <span class="err">Select at least one item to waive.</span></div>`;
}
function syncWaiveRows() {
  document.querySelectorAll('[data-wv-row]').forEach(tr => { const c = tr.querySelector('[data-wv]'); if (!c.disabled) tr.classList.toggle('on', c.checked); });
  const open = [...document.querySelectorAll('[data-wv]:not(:disabled)')], all = $('[data-wv-all]');
  if (all && open.length) { all.checked = open.every(c => c.checked); all.indeterminate = !all.checked && open.some(c => c.checked); }
  if (open.some(c => c.checked)) $('#fWv')?.classList.remove('invalid');
}

function confirmModal() {
  const note = ($('#mNote')?.value || '').trim();
  const waivedItems = modal.kind === 'waive' ? [...document.querySelectorAll('[data-wv]:checked:not(:disabled)')].map(c => +c.dataset.wv) : [];
  if (modal.kind === 'waive' && !waivedItems.length) { $('#fWv').classList.add('invalid'); return; }
  if ((modal.kind === 'decline' || modal.kind === 'hold' || modal.kind === 'waive') && !note) { $('#fNote').classList.add('invalid'); $('#mNote').focus(); return; }
  const now = new Date();
  const rs = modal.ids.map(id => findReq(id)).filter(Boolean);
  rs.forEach(r => {
    if (modal.kind === 'approve' || modal.kind === 'waive') {
      r.history.push({ t:'approved', by:me, at:now, note, ...(modal.kind === 'waive' ? { waive:true, waivedItems } : {}) });
      r.level++;
      r.status = r.level >= r.chain.length ? 'approved' : 'pending';
    } else if (modal.kind === 'decline') {
      r.history.push({ t:'declined', by:me, at:now, note });
      r.status = 'declined';
    } else if (modal.kind === 'hold') {
      r.history.push({ t:'hold', by:me, at:now, note });
      r.status = 'hold';
      if ($('#mAsk')?.checked) { r.clar.push({ by:me, at:now, text:note }); if (!r.shared) scheduleReply(r); }
    } else if (modal.kind === 'unhold') {
      r.history.push({ t:'unhold', by:me, at:now, note });
      r.status = 'pending';
    }
  });
  const lost = rs.filter(r => r.shared && !commitIR(r));
  if (lost.length) toast(`${lost.map(r => r.ref).join(', ')} was withdrawn by the vendor`, 'info');
  const n = rs.length, r0 = rs[0], kind = modal.kind;
  const msg = {
    approve: n > 1 ? `${n} requests approved` : r0.status === 'approved' ? `${r0.ref} approved` : `${r0.ref} approved · sent to ${P(currentApprover(r0)).name}`,
    waive: `${r0.ref} approved · inspection waived for ${waivedItems.length} item${waivedItems.length > 1 ? 's' : ''}${r0.status === 'approved' ? '' : ` · sent to ${P(currentApprover(r0)).name}`}`,
    decline: n > 1 ? `${n} requests declined` : `${r0.ref} declined`,
    hold: `${r0.ref} moved to Hold`, unhold: `${r0.ref} moved back to Pending`,
  }[modal.kind];
  if (modal.kind !== 'unhold') ui.open = null;
  ui.sel.clear();
  modal = null;
  save(); render();
  toast(msg, kind === 'decline' ? 'x' : kind === 'hold' ? 'pause' : 'check');
}

/* Simulated requester reply so the clarification loop can be demoed end to end */
const REPLIES = {
  po:'Revised quotation with freight break-up is attached in Files. Landed rate is unchanged.',
  ir:'Test certificates for all batches are uploaded. Third-party inspector is booked for the requested date.',
  bg:'The bank has confirmed the BG through SFMS; confirmation copy is attached.',
};
function scheduleReply(r) {
  if (PEOPLE[r.asker].persona) return;          // the other persona answers it themselves
  ui.typing = r.id;
  setTimeout(() => {
    ui.typing = null;
    r.clar.push({ by:r.asker, at:new Date(), text:REPLIES[r.type] });
    save(); render();
    toast(`${P(r.asker).name} replied on ${r.ref}`, 'msg');
  }, 2600);
}

/* =====================================================================
   Render & events
   ===================================================================== */
function render() {
  SHARED = irReqs();
  document.body.classList.toggle('collapsed', ui.collapsed);
  renderSidebar();
  const m = $('#main');
  const keepFocus = document.activeElement?.id === 'q';
  const caret = keepFocus ? document.activeElement.selectionStart : 0;
  m.innerHTML = ui.page === 'home' ? renderHome() : (ui.page === 'team' || ui.page === 'mine') ? renderApprovals(ui.page) : renderOther();
  if (keepFocus) { const q = $('#q'); q.focus(); q.setSelectionRange(caret, caret); }
  const dScroll = $('.d-body')?.scrollTop;
  $('#layer').innerHTML = renderDrawer() + renderModal();
  if (dScroll && $('.d-body')) $('.d-body').scrollTop = dScroll;
  document.body.style.overflow = ui.open ? 'hidden' : '';
}

function openReq(id) { ui.open = id; ui.dtab = 'approval'; ui.pop = null; render(); }

document.addEventListener('click', e => {
  const t = e.target;
  // close popovers on outside click
  if (ui.pop && !t.closest('.pop') && !t.closest('[data-act="pop"],[data-act="switch"],[data-act="profile"],[data-act="bell"]')) { ui.pop = null; render(); if (!t.closest('button,input,tr,label')) return; }

  const sel = t.closest('[data-sel]');
  if (sel) { e.stopPropagation(); sel.checked ? ui.sel.add(sel.dataset.sel) : ui.sel.delete(sel.dataset.sel); render(); return; }
  if (t.closest('[data-type]')) { const k = t.closest('[data-type]').dataset.type; ui.types.has(k) ? ui.types.delete(k) : ui.types.add(k); render(); return; }

  const nav = t.closest('[data-nav]');
  if (nav) {
    ui.page = nav.dataset.nav; ui.pop = null; ui.sel.clear(); ui.q = ''; ui.types.clear();
    if (ui.page === 'team') ui.tab = 'pending';
    if (ui.page === 'team' || ui.page === 'mine') ui.navOpen.approvals = true;
    document.body.classList.remove('nav-open');
    render(); window.scrollTo(0, 0); return;
  }
  if (t.closest('[data-toggle]')) { ui.navOpen.approvals = !ui.navOpen.approvals; render(); return; }
  const tab = t.closest('[data-tab]');
  if (tab) { ui.tab = tab.dataset.tab; ui.sel.clear(); render(); return; }
  const dt = t.closest('[data-dtab]');
  if (dt) { ui.dtab = dt.dataset.dtab; render(); $('.d-body') && ($('.d-body').scrollTop = 0); return; }
  const so = t.closest('[data-sort]');
  if (so) { ui.sort = so.dataset.sort; ui.pop = null; render(); return; }
  const ps = t.closest('[data-persona]');
  if (ps) { me = ps.dataset.persona; ui.pop = null; ui.sel.clear(); ui.open = null; save(); render(); toast(`Logged in as ${P(me).name}`, 'swap'); return; }
  const chip = t.closest('[data-chip]');
  if (chip) { const ta = $('#clarText'); ta.value = chip.dataset.chip + (chip.dataset.chip.endsWith('.') ? '' : '.'); ta.focus(); return; }
  if (t.matches('[data-wv-all]')) { document.querySelectorAll('[data-wv]:not(:disabled)').forEach(c => c.checked = t.checked); syncWaiveRows(); return; }
  if (t.matches('[data-wv]')) { syncWaiveRows(); return; }
  if (t.closest('[data-wv-row]') && !t.closest('input')) { const c = t.closest('[data-wv-row]').querySelector('[data-wv]'); if (!c.disabled) { c.checked = !c.checked; syncWaiveRows(); } return; }
  const mchip = t.closest('[data-mchip]');
  if (mchip) { $('#mNote').value = mchip.dataset.mchip; $('#fNote')?.classList.remove('invalid'); return; }

  const op = t.closest('[data-open]');
  if (op && !t.closest('[data-act]')) { openReq(op.dataset.open); return; }

  const a = t.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act;
  const r = findReq(ui.open);
  switch (act) {
    case 'soon': toast(`${a.dataset.what} isn't part of this prototype`, 'info'); break;
    case 'pop': ui.pop = ui.pop === a.dataset.pop ? null : a.dataset.pop; render(); break;
    case 'close-pop': ui.pop = null; render(); break;
    case 'switch': case 'profile': case 'bell': ui.pop = ui.pop === act ? null : act; render(); break;
    case 'reset': REQS = seed(); me = 'rahul'; ui.pop = null; ui.open = null; ui.sel.clear(); save(); render(); toast('Demo data reset', 'refresh'); break;
    case 'clear-filters': ui.types.clear(); ui.q = ''; ui.pop = null; render(); break;
    case 'view': ui.view = ui.view === 'list' ? 'cards' : 'list'; render(); break;
    case 'sel-all': { const L = filtered(ui.page); const all = L.every(r => ui.sel.has(r.id)); L.forEach(r => all ? ui.sel.delete(r.id) : ui.sel.add(r.id)); render(); break; }
    case 'sel-clear': ui.sel.clear(); render(); break;
    case 'bulk-approve': modal = { kind:'approve', ids:[...ui.sel] }; render(); break;
    case 'bulk-decline': modal = { kind:'decline', ids:[...ui.sel] }; render(); $('#mNote')?.focus(); break;
    case 'export': exportCsv(); break;
    case 'scroll': $('#paRow')?.scrollBy({ left: 300 * +a.dataset.dir }); break;
    case 'nav-open': document.body.classList.add('nav-open'); break;
    case 'close': ui.open = null; render(); break;
    case 'approve': case 'decline': case 'hold': case 'unhold': case 'waive': modal = { kind:act, ids:[r.id] }; render(); $('#mNote')?.focus(); break;
    case 'm-close': modal = null; render(); break;
    case 'm-close-bg': if (t === a) { modal = null; render(); } break;
    case 'm-confirm': confirmModal(); break;
    case 'file': toast(`Opening ${a.dataset.name}`, 'external'); break;
    case 'send-clar': {
      const txt = $('#clarText').value.trim();
      if (!txt) { $('#clarText').focus(); return; }
      r.clar.push({ by:me, at:new Date(), text:txt });
      if (r.shared) { if (!commitIR(r)) { render(); toast(`${r.ref} was withdrawn by the vendor`, 'info'); break; } }
      else if (r.asker !== me) scheduleReply(r);
      save(); render(); toast(r.shared ? `Sent to ${P(r.asker).name} on the Vendor Portal` : 'Clarification sent', 'send');
      break;
    }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { ui.q = e.target.value; render(); }
  if (e.target.id === 'mNote') $('#fNote')?.classList.remove('invalid');
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (modal) { modal = null; render(); }
  else if (ui.pop) { ui.pop = null; render(); }
  else if (ui.open) { ui.open = null; render(); }
  else document.body.classList.remove('nav-open');
});
/* a new / withdrawn IR or a vendor reply arrives from the Vendor Portal */
addEventListener('storage', e => {
  if (e.key !== IR_STORE) return;
  const before = new Map(SHARED.map(r => [r.id, r]));
  render();
  const fresh = SHARED.filter(r => !before.has(r.id) && isMine(r));
  const replied = SHARED.filter(r => before.has(r.id) && r.clar.length > before.get(r.id).clar.length && r.clar[r.clar.length - 1].by === r.asker && r.chain.includes(me));
  if (fresh.length) toast(`${fresh[0].ref} from ${P(fresh[0].asker).name} is awaiting your approval`, 'bell');
  else if (replied.length) toast(`${P(replied[0].asker).name} replied on ${replied[0].ref}`, 'msg');
});
$('#collapseBtn').innerHTML = icon('chevLeft', 20, 2);
$('#collapseBtn').addEventListener('click', () => { ui.collapsed = !ui.collapsed; render(); });
$('#fab').innerHTML = fabMark;
$('#fab').addEventListener('click', () => toast("Dice assistant isn't part of this prototype", 'info'));

function exportCsv() {
  const L = filtered(ui.page);
  if (!L.length) { toast('Nothing to export', 'info'); return; }
  const rows = [['Reference','Type','Details','Vendor','Amount (INR)','Asked By','Status','Received']];
  L.forEach(r => rows.push([r.ref, TYPES[r.type].slug, subLines(r).join(' | '), VENDORS[r.vendor]?.name || '', amountOf(r) != null ? amountOf(r).toFixed(2) : '', P(r.asker).name, r.status, fDate(r.received)]));
  const csv = rows.map(row => row.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const url = URL.createObjectURL(new Blob([csv], { type:'text/csv' }));
  const link = Object.assign(document.createElement('a'), { href:url, download:`approvals-${ui.tab}.csv` });
  document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url);
  toast(`Exported ${L.length} request${L.length > 1 ? 's' : ''}`, 'export');
}

render();
</script>
